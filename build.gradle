plugins {
 id 'fabric-loom' version '1.14.10'
 id 'maven-publish'
}
group = 'me.zziger.obsoverlay'
version = project.mod_version
base { archivesName = 'obs-overlay-fabric' }
repositories { maven { url 'https://maven.terraformersmc.com/releases' } }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
 modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
 modCompileOnly 'com.terraformersmc:modmenu:17.0.0-beta.1'
}
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
jar { from('LICENSE', 'MINHOOK-LICENSE.txt') }

sourceSets {
    smoke {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
configurations { smokeImplementation.extendsFrom modImplementation, implementation }
dependencies { smokeImplementation sourceSets.main.output }
loom {
    runs {
        smoke {
            client()
            name 'Mixin smoke test'
            source sourceSets.main
            vmArg '-Dfabric.addMods=' + layout.buildDirectory.file('smoke/overlay-smoke.jar').get().asFile.absolutePath
            if (project.hasProperty('glSmoke')) vmArg '-Dobs.overlay.glSmoke=true'
        }
    }
    mods {
        obs_overlay { sourceSet sourceSets.main }
    }
}
tasks.register('smokeJar', Jar) {
    dependsOn smokeClasses
    from sourceSets.smoke.output
    archiveFileName = 'overlay-smoke.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
}
tasks.named('runSmoke') { dependsOn smokeJar }
tasks.register('policyTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.zziger.obsoverlay.port.PolicyTest'
}
check.dependsOn policyTest
test { failOnNoDiscoveredTests = false }
