plugins {
 id 'net.fabricmc.fabric-loom' version '1.19.3'
 id 'maven-publish'
}
group = 'me.zziger.obsoverlay'
if (project.hasProperty('glSmoke') && project.hasProperty('vkSmoke')) {
    throw new GradleException('Run glSmoke and vkSmoke in separate invocations: SDL native bootstrap is process-scoped.')
}
version = project.mod_version
base { archivesName = 'obs-overlay-fabric' }
repositories {
    maven {
        url 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
 implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
 compileOnly 'maven.modrinth:modmenu:21.0.0'
}
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
jar { from('LICENSE', 'MINHOOK-LICENSE.txt') }

sourceSets {
    smoke {
        java.setSrcDirs(['src/smoke26/java'])
        resources.setSrcDirs(['src/smoke26/resources'])
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
configurations { smokeImplementation.extendsFrom implementation }
dependencies { smokeImplementation sourceSets.main.output }
loom {
    runs {
        smoke {
            client()
            runDir 'run26_3'
            name 'Mixin smoke test'
            source sourceSets.main
            vmArg '-Dfabric.addMods=' + layout.buildDirectory.file('smoke/overlay-smoke.jar').get().asFile.absolutePath
            if (project.hasProperty('glSmoke')) vmArg '-Dobs.overlay.glSmoke=true'
            if (project.hasProperty('desktopSmoke')) vmArg '-Dobs.overlay.desktopSmoke=true'
            if (project.hasProperty('vkSmoke')) vmArg '-Dobs.overlay.vkSmoke=true'
            if (project.hasProperty('visibleSmoke')) vmArg '-Dobs.overlay.visibleSmoke=true'
            if (project.hasProperty('gameSmoke')) {
                vmArg '-Dobs.overlay.gameSmoke=true'
                vmArg '-Xmx2G'
                vmArg '-Djava.awt.headless=true'
            }
        }
    }
    mods {
        obs_overlay { sourceSet sourceSets.main }
    }
}
tasks.register('smokeJar', Jar) {
    dependsOn smokeClasses
    from sourceSets.smoke.output
    archiveFileName = 'overlay-smoke.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
}
tasks.named('runSmoke') { dependsOn smokeJar }
tasks.register('policyTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.zziger.obsoverlay.port.PolicyTest'
}
check.dependsOn policyTest
['RenderPassContractTest', 'RenderTargetRouterTest', 'TextureOwnershipTest'].each { contract ->
    def verification = tasks.register(contract, JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = contract
    }
    check.dependsOn verification
}
test { failOnNoDiscoveredTests = false }
