name: Build Minecraft 1.21.11
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build runSmoke -x downloadAssets --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: obs-overlay-fabric-1.21.11
          path: build/libs/*.jar
